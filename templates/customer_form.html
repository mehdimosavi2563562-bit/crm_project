{% extends 'base.html' %}

{% block title %}فرم مشتری{% endblock %}

{% block content %}
<h2 class="mb-4">فرم مشتری</h2>

<form method="POST">
  <div class="mb-3">
    <label class="form-label">نام</label>
    <input type="text" class="form-control" name="first_name" value="{{ customer.first_name if customer else '' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">نام خانوادگی</label>
    <input type="text" class="form-control" name="last_name" value="{{ customer.last_name if customer else '' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">تلفن</label>
    <input type="text" class="form-control" name="phone" value="{{ customer.phone if customer else '' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">آدرس</label>
    <textarea class="form-control" name="address" rows="3" required>{{ customer.address if customer else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-success w-100">ذخیره</button>
</form>
{% endblock %}
